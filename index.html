<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Обедно меню · Чичовци</title>
<meta name="description" content="Днешното обедно меню на ресторант Чичовци, Пловдив. Обяд от 11:30, понеделник – петък.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Alegreya+Sans:wght@400;500;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  /* Чичовци – обедно меню. Посока: модерна механа край реката.
     Тъмнозелено (бор / река), ленено бяло, шевица в червено и черно, месинг за детайли. */
  :root{
    --linen:#F8F6F1; --paper:#FFFFFF; --ink:#1D1B19; --muted:#6B655D; --line:#E2DCD1;
    --pine:#23413A; --pine-ink:#F3EFE6; --shevitsa:#A8261D; --brass:#A57B2C; --soft:#EFEAE0;
  }
  @media (prefers-color-scheme: dark){
    :root{ --linen:#161514; --paper:#1E1C1A; --ink:#EEE8DE; --muted:#A79F94; --line:#34302B;
      --pine:#1B332D; --pine-ink:#F3EFE6; --shevitsa:#D1493D; --brass:#D2A653; --soft:#262320; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--linen);color:var(--ink);
    font:17px/1.3 "Alegreya Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}

  /* ---- Горна част ---- */
  .hero{background:var(--pine);color:var(--pine-ink);text-align:center;position:relative;
    padding:6px 16px 8px}
  .lang{position:absolute;top:14px;right:14px;display:flex;border:1px solid rgba(243,239,230,.35);
    border-radius:999px;overflow:hidden}
  .lang button{border:0;background:transparent;color:var(--pine-ink);padding:5px 11px;font:inherit;
    font-size:.85rem;font-weight:700;cursor:pointer;min-width:40px;min-height:32px}
  .lang button[aria-pressed="true"]{background:var(--pine-ink);color:var(--pine)}
  .brand{font-family:"Marck Script",cursive;font-weight:400;font-size:clamp(2.5rem,12vw,3.4rem);
    line-height:1;margin:6px 0 0;letter-spacing:.01em}
  .title{font-size:1.05rem;font-weight:500;letter-spacing:.06em;margin:0;opacity:.92}
  .addr{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;
    text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
  .addr svg{width:14px;height:14px;flex:none}
  .addr:hover{color:var(--ink)}

  /* ---- Съдържание ---- */
  .wrap{max-width:560px;margin:0 auto;padding:8px 16px 32px}
  .date{text-align:center;color:var(--muted);font-size:1rem;margin:2px 0 4px}

  section.cat{margin-top:8px}
  section.cat + section.cat{margin-top:10px;padding-top:10px;position:relative}
  section.cat + section.cat::before{ /* разделител между категориите: линия с ромбче */
    content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--line)}
  section.cat + section.cat::after{
    content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;margin-left:-5px;
    background:var(--shevitsa);transform:rotate(45deg);box-shadow:0 0 0 4px var(--linen)}
  .cat h2{font-family:"Marck Script",cursive;font-weight:400;font-size:1.55rem;line-height:1.05;
    color:var(--pine);margin:0 0 2px}
  @media (prefers-color-scheme: dark){ .cat h2{color:#9CC3B3} }

  ul{list-style:none;margin:0;padding:0}
  li{padding:2px 0}
  .row{display:flex;align-items:baseline;gap:8px}
  .name{font-weight:500;font-size:1.06rem}
  .lead{flex:1;min-width:16px;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
  .price{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
  .note{display:block;font-style:italic;color:var(--muted);font-size:.93rem;line-height:1.25;margin-top:0}
  .na{display:block;color:var(--shevitsa);font-size:.85rem;margin-top:1px}

  .msg{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;margin:18px 0 0}
  .hours{color:var(--muted);font-size:.95rem;margin:22px 0 0;text-align:center}
  .msg .hours{margin-top:8px;text-align:left}

  /* ---- Бутони ---- */
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .btn{display:flex;align-items:center;gap:10px;min-height:46px;padding:7px 10px;
    border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
    text-decoration:none;text-align:left;line-height:1.15}
  .btn .ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    background:var(--c,var(--pine));color:#fff}
  .btn .ic svg{width:17px;height:17px}
  .btn .tx{display:flex;flex-direction:column;min-width:0}
  .btn .tx b{font-weight:700;font-size:.98rem}
  .btn .tx small{font-size:.8rem;color:var(--muted)}
  .btn:hover{border-color:var(--c,var(--pine))}
  .btn.primary{grid-column:1/-1;justify-content:center;min-height:50px;background:var(--pine);
    border-color:var(--pine);color:var(--pine-ink);font-size:1.08rem;font-weight:700}
  .btn.primary .ic{background:rgba(243,239,230,.18)}
  #b-viber{--c:#7360F2} #b-tg{--c:#229ED9} #b-fb{--c:#1877F2} #b-menu{--c:#A57B2C} #b-map{--c:#A8261D}
  .btn[hidden]{display:none}
  .btn.wide{grid-column:1/-1}
  footer{color:var(--muted);font-size:.85rem;margin-top:22px;text-align:center}
  .skeleton{color:var(--muted);padding:18px 0;text-align:center}
</style>
</head>
<body>
<header class="hero">
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="bg">BG</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <div class="brand" data-t="brand"></div>
  <h1 class="title" data-t="title"></h1>
</header>

<div class="wrap">
  <div class="date" id="date"></div>

  <main id="menu"><div class="skeleton" data-t="loading"></div></main>

  <nav class="btns" aria-label="Contacts">
    <a class="btn primary" id="b-call" href="tel:+359895111277"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></span><span class="tx"><b></b></span></a>
    <a class="btn" id="b-viber" hidden target="_blank" rel="noopener"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.5 3 3 6.2 3 10.6c0 2.5 1.2 4.5 3.2 5.8V21l3.6-2.6c.7.1 1.4.2 2.2.2 5.5 0 9-3.2 9-7.9S17.5 3 12 3zm3.8 10.2-.9.9c-.4.4-1.2.3-2.3-.3a9 9 0 0 1-3.4-3.4c-.6-1.1-.7-1.9-.3-2.3l.9-.9.5.1 1 1.6-.1.5-.5.5c.2.6 1.2 1.6 1.8 1.8l.5-.5.5-.1 1.6 1-.1.5z"/></svg></span><span class="tx"><b></b><small></small></span></a>
    <a class="btn" id="b-tg" href="https://t.me/restaurant_chichovci" target="_blank" rel="noopener"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.5 3.6 2.9 10.8c-.9.4-.9 1.6.1 1.9l4.7 1.5 1.8 5.6c.3.8 1.3 1 1.9.4l2.6-2.5 4.8 3.6c.7.5 1.7.1 1.9-.7l3.1-15.7c.2-1-.8-1.7-1.7-1.3zM9.6 14.2l8.6-7.7-6.9 9.1-.3 3-1.4-4.4z"/></svg></span><span class="tx"><b></b><small></small></span></a>
    <a class="btn" id="b-fb" hidden target="_blank" rel="noopener"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4V10.5H7.8v3h2.6V21z"/></svg></span><span class="tx"><b></b><small></small></span></a>
    <a class="btn" id="b-menu" href="https://chichovci.github.io/chichovtsi-menu/index-view.html"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 4h6a2 2 0 0 1 1 .3A2 2 0 0 1 13 4h6a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-5.5a1.5 1.5 0 0 0-1.5 1h-0a1.5 1.5 0 0 0-1.5-1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v11h5V6.5a.5.5 0 0 0-.5-.5zm7 .5V17h5V6h-4.5a.5.5 0 0 0-.5.5z"/></svg></span><span class="tx"><b></b><small></small></span></a>
    <a class="btn wide" id="b-map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=%D0%A0%D0%B5%D1%81%D1%82%D0%BE%D1%80%D0%B0%D0%BD%D1%82%20%D0%A7%D0%B8%D1%87%D0%BE%D0%B2%D1%86%D0%B8%20%D0%9F%D0%BB%D0%BE%D0%B2%D0%B4%D0%B8%D0%B2&amp;query_place_id=ChIJj45PDpbRrBQRhvUfZPUjuBg"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></span><span class="tx"><b></b><small></small></span></a>
  </nav>

  <footer><a class="addr" id="addr" href="https://www.google.com/maps/search/?api=1&amp;query=%D0%A0%D0%B5%D1%81%D1%82%D0%BE%D1%80%D0%B0%D0%BD%D1%82%20%D0%A7%D0%B8%D1%87%D0%BE%D0%B2%D1%86%D0%B8%20%D0%9F%D0%BB%D0%BE%D0%B2%D0%B4%D0%B8%D0%B2&amp;query_place_id=ChIJj45PDpbRrBQRhvUfZPUjuBg" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
    <span data-t="footer"></span>
  </a></footer>
</div>

<script>
(() => {
  // ---- Настройки ----
  const SHEET_ID = "1ZQqI3emCG4cQqx6R9NZqc3CdZStpjFK8k7vZ7vUoa4I";
  const DAY_SHEET = "Обяд_страница";
  const DICT_SHEET = "Речник";
  const LINKS = {
    viber: "https://invite.viber.com/?g2=AQAkNd4n5ncc91PKqv%2FMk%2Fn5ISLrl172S7%2FOX6XSdJ%2BeArfttzKNAlbu5OxP%2BwfD",     // Viber общност „Меню“
    facebook: "https://www.facebook.com/Chichovci"   // Facebook страницата
  };
  const CATS = [
    { key: "salads",   bg: "Салати",   en: "Salads" },
    { key: "soups",    bg: "Супи",     en: "Soups" },
    { key: "mains",    bg: "Основни",  en: "Mains" },
    { key: "desserts", bg: "Десерти",  en: "Desserts" }
  ];

  const T = {
    bg: {
      place: "бул. „Марица“ 90, Пловдив", title: "Обедно меню", loading: "Зареждане…",
      call: ["Обади ни се"], viber: ["Viber", "Обедното меню всеки делничен ден"], tg: ["Telegram", "Обедното меню всеки делничен ден"], fb: ["Facebook", "Новини и снимки"],
      menu: ["Цялото меню", "Всички ястия"], map: ["Как да стигнете", "Google Maps"],
      hours: "Обяд от 11:30, понеделник – петък",
      brand: "Чичовци",
      notYet: "Днешното обедно меню ще бъде публикувано до 11:00.",
      notPosted: "Днешното меню още не е публикувано тук. Обадете ни се – с радост ще ви кажем какво има днес.",
      weekend: "Обедното меню почива през уикенда. Очакваме ви в понеделник с прясно сготвени ястия!",
      error: "Менюто не може да се зареди в момента. Обадете ни се – с радост ще ви кажем какво има днес.",
      preview: "Преглед на меню за друга дата – това НЕ е днешното меню.",
      toToday: "Към днешното меню",
      footer: "Ресторант Чичовци, бул. „Марица“ 90, Пловдив",
      na: "",
      weekdays: ["неделя","понеделник","вторник","сряда","четвъртък","петък","събота"]
    },
    en: {
      place: "90 Maritsa Blvd, Plovdiv", title: "Lunch menu", loading: "Loading…",
      call: ["Call us"], viber: ["Viber", "Weekday lunch menu"], tg: ["Telegram", "Weekday lunch menu"], fb: ["Facebook", "News & photos"],
      menu: ["Full menu", "All dishes"], map: ["Directions", "Google Maps"],
      hours: "Lunch from 11:30, Monday to Friday",
      brand: "Chichovci",
      notYet: "Today's lunch menu will be posted by 11:00.",
      notPosted: "Today's menu isn't posted here yet. Give us a call – we'll gladly tell you what's on today.",
      weekend: "Our lunch menu takes the weekend off. See you on Monday for freshly cooked dishes!",
      error: "The menu can't be loaded right now. Give us a call – we'll gladly tell you what's on today.",
      preview: "Preview of a menu for another date – this is NOT today's menu.",
      toToday: "Go to today's menu",
      footer: "Chichovci Restaurant, 90 Maritsa Blvd, Plovdiv",
      na: "Translation not yet available",
      weekdays: ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]
    }
  };

  // ---- Помощни ----
  const norm = s => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  // Ястие без превод: официална транслитерация на латиница (не превод), напр. „Млечна салата“ → „Mlechna salata“
  const TR = {а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sht",ъ:"a",ь:"y",ю:"yu",я:"ya"};
  const isUp = c => !!c && c !== c.toLowerCase();
  const translit = s => String(s)
    .replace(/(и)(я)(?![а-я])/gi, (m, i, ya) => (i === "И" ? "I" : "i") + (ya === "Я" ? "A" : "a"))
    .replace(/[а-я]/gi, (ch, at, str) => {
      const low = ch.toLowerCase(), r = TR[low];
      if (r === undefined) return ch;
      if (ch === low) return r;
      return (isUp(str[at + 1]) || isUp(str[at - 1])) ? r.toUpperCase() : r.charAt(0).toUpperCase() + r.slice(1);
    });
  const params = new URLSearchParams(location.search);

  function sofiaToday() {
    const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Sofia", day: "2-digit", month: "2-digit", year: "2-digit" })
      .formatToParts(new Date()).reduce((o, x) => (o[x.type] = x.value, o), {});
    return `${p.day}.${p.month}.${p.year}`;
  }
  function parseDate(s) {
    const m = /^(\d{2})\.(\d{2})\.(\d{2})$/.exec(s || "");
    return m ? new Date(Date.UTC(2000 + +m[3], +m[2] - 1, +m[1], 12)) : null;
  }
  function fmtPrice(p, lang) {
    if (!/^\d{1,3}\.\d{2}$/.test(p || "")) return "";
    return lang === "bg" ? `${p.replace(".", ",")} €` : `€${p}`;
  }

  async function gviz(sheet, range) {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=0` +
      `&sheet=${encodeURIComponent(sheet)}&range=${range}&t=${Date.now()}`;
    const txt = await (await fetch(url, { cache: "no-store" })).text();
    const json = JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
    return (json.table.rows || []).map(r => (r.c || []).map(c => (c && c.v != null ? String(c.v) : "")));
  }

  // ---- Състояние ----
  const today = sofiaToday();
  const wanted = /^\d{2}\.\d{2}\.\d{2}$/.test(params.get("date") || "") ? params.get("date") : today;
  const isPreview = wanted !== today;
  let lang = params.get("lang") === "en" ? "en" : params.get("lang") === "bg" ? "bg"
           : ((navigator.language || "").toLowerCase().startsWith("bg") ? "bg" : "en");
  let day = null;          // { items }
  let dict = new Map();    // ключ → { en, note }
  let state = "loading";   // loading | ok | none | error

  // ---- Изобразяване ----
  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.title = lang === "bg" ? "Обедно меню · Чичовци" : "Lunch menu · Chichovci";
    document.querySelectorAll("[data-t]").forEach(el => el.textContent = t[el.dataset.t]);
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

    const d = parseDate(wanted);
    document.getElementById("date").textContent = d
      ? `${t.weekdays[d.getUTCDay()]}, ${wanted.slice(0, 5)}.20${wanted.slice(6)}` : wanted;


    const set = (id, text, href) => { const a = document.getElementById(id); a.querySelector(".tx b").textContent = text[0]; const sm = a.querySelector(".tx small"); if (sm) sm.textContent = text[1] || ""; a.setAttribute("aria-label", text.join(" – ")); if (href !== undefined) { a.hidden = !href; if (href) a.href = href; } };
    set("b-call", t.call); set("b-tg", t.tg); set("b-menu", t.menu); set("b-map", t.map);
    set("b-viber", t.viber, LINKS.viber); set("b-fb", t.fb, LINKS.facebook);

    const box = document.getElementById("menu");
    if (state === "loading") { box.innerHTML = `<div class="skeleton">${esc(t.loading)}</div>`; return; }
    if (state === "error")   { box.innerHTML = `<div class="msg">${esc(t.error)}<p class="hours">${esc(t.hours)}</p></div>`; return; }
    if (state === "none") {
      const wd = d ? d.getUTCDay() : 1;
      const hour = +new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Sofia", hour: "2-digit", hourCycle: "h23" }).format(new Date());
      const m = (wd === 0 || wd === 6) ? t.weekend : (!isPreview && hour < 11 ? t.notYet : t.notPosted);
      box.innerHTML = `<div class="msg">${esc(m)}<p class="hours">${esc(t.hours)}</p></div>`;
      return;
    }

    let html = "";
    for (const c of CATS) {
      const list = Array.isArray(day.items[c.key]) ? day.items[c.key].filter(x => x && String(x.bg || "").trim()) : [];
      if (!list.length) continue;
      html += `<section class="cat"><h2>${esc(c[lang])}</h2><ul>`;
      for (const it of list) {
        const bg = String(it.bg).trim();
        const tr = dict.get(norm(bg));
        let name, extra = "";
        if (lang === "bg") name = bg;
        else if (tr && tr.en) { name = tr.en; if (tr.note) extra = `<span class="note">${esc(tr.note)}</span>`; }
        else { name = translit(bg); }
        const pr = fmtPrice(it.price, lang);
        html += `<li><div class="row"><span class="name">${esc(name)}</span>${pr ? `<span class="lead"></span><span class="price">${esc(pr)}</span>` : ""}</div>${extra}</li>`;
      }
      html += `</ul></section>`;
    }
    box.innerHTML = `${html}<p class="hours">${esc(t.hours)}</p>`;
  }

  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    const p = new URLSearchParams(location.search); p.set("lang", lang);
    history.replaceState(null, "", `${location.pathname}?${p}`);
    render();
  }));

  // ---- Зареждане ----
  render();
  Promise.all([
    gviz(DAY_SHEET, "A2:C"),
    gviz(DICT_SHEET, "B2:H").catch(() => [])     // речникът е по желание: без него EN показва BG + бележка
  ]).then(([days, dictRows]) => {
    // Речник: първият ред за всеки ключ печели
    for (const r of dictRows) {
      const key = norm(r[6] || r[0]);              // H = BG_key, иначе B
      if (key && r[1] && !dict.has(key)) dict.set(key, { en: r[1].trim(), note: (r[5] || "").trim() });
    }
    // Ден: при повече редове за една дата – най-новото „Обновено“, при равенство последният ред
    let best = null, bestC = "";
    days.forEach(r => {
      if ((r[0] || "").trim() !== wanted) return;
      const c = r[2] || "";
      if (!best || c >= bestC) { best = r; bestC = c; }
    });
    if (best) {
      try { day = { items: JSON.parse(best[1]) || {} }; state = "ok"; }
      catch (e) { state = "error"; }
      if (state === "ok" && !CATS.some(c => Array.isArray(day.items[c.key]) && day.items[c.key].length)) state = "none";
    } else state = "none";
    render();
  }).catch(() => { state = "error"; render(); });
})();
</script>
</body>
